# P1 only: fuse FRONT, DOWN, and home-pose ARM RGB-D while AGX moves in hospital.
sensors:
  front_prim_path: pan_tilt_pitch_link/pan_tilt_surface/camera_mount/camera_body/camera_base/PanCamera
  down_prim_path: dummy_base_link/DownCamera
  arm_prim_path: link6/Camera
  observer_prim_path: dummy_base_link/observeCamera

camera:
  width: 640
  height: 480
  frequency_hz: 15

map:
  size_x_m: 10.0
  size_y_m: 10.0
  min_z_m: -0.20
  max_z_m: 2.80
  resolution_m: 0.05
  slide_threshold_m: 0.20
  min_depth_m: 0.12
  max_depth_m: 5.0
  max_ray_length_m: 5.0
  pixel_stride: 10
  probability_hit: 0.85
  probability_miss: 0.30
  probability_min: 0.12
  probability_max: 0.98
  probability_occupied: 0.80
  probability_free: 0.45
  integration_period_sec: 0.25

validation:
  warmup_render_frames: 20
  max_frame_skew_sec: 0.08
  required_map_updates: 3
  minimum_rays_per_camera: 100
  minimum_known_voxels: 500
  minimum_occupied_voxels: 20

debug:
  output_path: debug/local/agx_local_3d_map.png
  update_period_sec: 0.50
