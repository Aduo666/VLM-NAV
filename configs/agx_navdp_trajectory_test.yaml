# Phase 1 only: NavDP multi-candidate generation and AGX continuous tracking.
# No occupancy map, collision filtering, VLM, or active arm observation is used.
server:
  base_url: "http://127.0.0.1:8889"
  timeout_sec: 30.0
  stop_threshold: -0.5
  jpeg_quality: 92
  max_abs_coordinate_m: 12.0
  max_point_jump_m: 2.0
  min_path_length_m: 0.08
  model_match_tolerance_m: 0.02

camera:
  width: 640
  height: 480
  frequency_hz: 15
  warmup_render_frames: 30

goal:
  # The goal is selected from the robot-centric BEV map.
  min_distance_m: 0.25
  max_distance_m: 10.0

execution:
  # Reject an asynchronous result if the robot drifted away from its capture pose.
  max_result_pose_delta_m: 0.05
  max_result_yaw_delta_deg: 2.0
  goal_reached_tolerance_m: 0.30

map_selector:
  # Reuse the accepted three-camera map geometry without using it for safety decisions.
  source_config_path: "configs/agx_local_3d_map_test.yaml"
  image_size_px: 420
  view_size_m: 10.0
  rear_view_m: 1.5
  render_period_sec: 0.25
  obstacle_min_relative_z_m: 0.05
  obstacle_max_relative_z_m: 1.50

debug:
  candidate_image_path: "debug/local/agx_navdp_candidates.png"
  view_size_m: 10.0
