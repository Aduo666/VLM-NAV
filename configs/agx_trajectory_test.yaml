# Independent AGX acceptance only. Does not change navigation or G1 settings.
camera:
  width: 640
  height: 480
  frequency_hz: 15
near_camera:
  # Relative to asset.prim_path. Existing USD Camera: keep its authored pose/lens.
  # If absent, create a temporary downward-facing camera in this test Stage only.
  prim_path: dummy_base_link/base_link/box_link/DownCamera
  position_m: [0.0, 0.0, 1.6]
  pitch_down_deg: 90.0
  horizontal_fov_deg: 100.0
geometry:
  resolution_m: 0.05
  size_m: 32.0
  min_depth_m: 0.15
  max_depth_m: 6.0
  pixel_stride: 4
  obstacle_min_height_m: 0.08
  obstacle_max_height_m: 1.8
safety:
  # Approximate AGX chassis envelope about the articulation/odom origin.
  # Includes wheels; not a certified full robot/arm collision model.
  front_m: 0.40
  rear_m: 0.40
  half_width_m: 0.32
  margin_m: 0.04
  sensor_timeout_sec: 0.35
  wall_timeout_sec: 2.0
  reaction_time_sec: 0.15
  preview_time_sec: 0.60
  braking_deceleration_mps2: 0.40
  braking_deceleration_radps2: 0.80
  release_good_frames: 3
  minimum_motion_mps: 0.05
  min_valid_depth_ratio: 0.05
  hold_log_period_sec: 5.0
debug:
  period_sec: 0.5
  output_path: debug/local/agx_safety.png
