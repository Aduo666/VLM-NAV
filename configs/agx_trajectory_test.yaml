# Isolated acceptance for AGX continuous tracking and narrow-passage traversal.
passage:
  gap_m: 0.95
  wall_thickness_m: 0.18
  wall_segment_length_m: 1.60
  wall_height_m: 1.30
  robot_half_width_m: 0.32
  door_forward_m: 2.20
  path_exit_distance_m: 2.00
