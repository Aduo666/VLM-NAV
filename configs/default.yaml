simulation:
  headless: false
  width: 1280
  height: 720
  active_gpu: null
  physics_gpu: 0
  multi_gpu: false
  warmup_steps: 30

robot:
  profile: "unitree_g1_29dof"
  #profile: "agx"

scene:
  usd_path: "usd/hospital.usd"
  prim_path: "/World/Environment"
  add_default_ground_plane: false
  add_dome_light: false
  stage_load_timeout_sec: 120.0
  viewport_eye: [7.0, -2.0, 4.0]
  viewport_target: [1.5, 4.0, 1.0]
  robot_start_xy_m: [1.5, 4.0]
  robot_start_orientation_deg: [0.0, 0.0, 0.0]

llm:
  api_key: "sk-bduqejichuzwbbzuesgwfvwswcetzfagmfkyadbpkzykfjjh"
  api_base_url: "https://api.siliconflow.cn/v1"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  timeout_sec: 30
  retry_cooldown_sec: 0.0
  upload_max_edge_px: 1024
  camera_image_detail: "high"

instruction:
  text: ""
  parse_max_tokens: 768
  parse_timeout_sec: 90
  cache_enabled: true
  cache_path: ".cache/instruction_plans.json"

perception:
  grounding:
    call_period_sec: 0.10
    reuse_last_observation_sec: 0.0
    upload_max_edge_px: 768
    min_bbox_area_ratio: 0.002
    max_bbox_area_ratio: 0.60
    min_bbox_width_px: 4
    min_bbox_height_px: 4
    max_bbox_aspect_ratio: 8.0
    min_depth_valid_ratio: 0.12
    depth_statistic: "median"
    center_patch_ratio: 0.25
    min_depth_m: 0.20
    max_depth_m: 10.0
    min_confidence: 0.50
    coordinate_mode: "auto"
    allow_normalized_bbox: true
    normalized_bbox_scale: 1000.0
    depth_region: "bbox_depth_cluster"
    depth_cluster_tolerance_ratio: 0.35
    depth_cluster_min_pixels: 16
    max_result_age_sec: 2.0
    max_result_pose_delta_m: 0.20
    max_result_yaw_delta_deg: 10.0
    detector:
      repo_path: "third_party/GroundingDINO"
      config_path: "weights/grounded_sam/GroundingDINO_SwinT_OGC.py"
      checkpoint_path: "weights/grounded_sam/groundingdino_swint_ogc.pth"
      device: "cuda:0"
      box_threshold: 0.45
      text_threshold: 0.25
      max_detections: 5
      nms_iou_threshold: 0.50
      text_encoder_path: "weights/grounded_sam/bert-base-uncased"
    semantic_verification:
      min_confidence: 0.50
      max_edge_px: 768
      auto_accept_confidence: 0.75
  landmark_tracking:
    min_visible_count: 2
    arrival_confirmations: 1
    arrival_window_size: 5
    arrival_recent_visible_sec: 3.0
    max_lost_count: 6
    anchor_update_min_consistent_observations: 2
    anchor_update_max_jump_m: 1.5
    confirm_confidence_threshold: 0.75
    potential_confidence_threshold: 0.50
    confirm_min_observations: 2
    confirm_max_anchor_jump_m: 0.75
    confirm_max_depth_jump_m: 3.0
    low_confidence_min_translation_m: 0.20
    low_confidence_min_yaw_deg: 10.0
  landmark_map:
    anchor_ttl_sec: 120.0
    min_confidence: 0.20
    log_period_sec: 2.0
mapping:
  occupancy:
    resolution_m: 0.08
    size_m: 80.0
    occupied_log_odds: 0.90
    free_log_odds: -0.25
    occupied_threshold: 1.20
    free_threshold: -0.45
    occupied_min_neighbors: 3
    unknown_is_traversable: false
    unknown_cell_cost: 0.80
    semantic_goal_step_m: 0.9
    semantic_goal_min_step_m: 0.45
    semantic_goal_lateral_search_m: 0.8
    semantic_anchor_snap_max_correction_m: 1.5
    semantic_anchor_snap_angular_tolerance_deg: 12.0
    semantic_anchor_snap_min_cells: 3
    semantic_anchor_snap_front_band_m: 0.30
  rgbd:
    update_period_sec: 0.20
    min_depth_m: 0.30
    max_depth_m: 10.0
    pixel_stride: 8
    vertical_min_ratio: 0.12
    vertical_max_ratio: 0.95
    obstacle_min_height_m: 0.10
    obstacle_max_height_m: 1.80
    floor_tolerance_below_m: 0.20
    bootstrap_sec: 0.8
    bootstrap_max_wait_sec: 3.0
  topology:
    node_spacing_m: 1.0
    turn_threshold_deg: 40.0
    merge_radius_m: 0.75
    landmark_bind_radius_m: 1.5
    max_nodes: 128
    recent_node_count: 8

navigation:
  safety:
    obstacle_avoidance_enabled: true
    near_field_memory_enabled: true
    near_field_memory_sec: 2.0
  candidates:
    max_candidates: 3
    min_distance_m: 0.55
    max_distance_m: 1.35
    slot_bearings_deg: [35.0, 18.0, 0.0, -18.0, -35.0]
    adaptive_count: 5
    adaptive_min_spacing_deg: 18.0
    adaptive_smoothing_px: 15
    min_free_ratio: 0.28
    column_half_width_px: 26
    unknown_gain_weight: 0.35
    semantic_weight: 0.45
  policy:
    replanning_cooldown_sec: 0.50
    visual_target_center_deadband_deg: 15.0
    region_transition:
      min_displacement_m: 1.0
      confirmations: 2
      min_confidence: 0.55
    semantic_turn:
      min_yaw_deg: 45.0
      max_yaw_deg: 105.0
      max_primitives: 7
      min_forward_clearance_m: 0.60
      alignment_confirmations: 2
      corridor_center_tolerance_deg: 10.0
      same_corridor_tolerance_deg: 15.0
      target_high_confidence: 0.75
      target_medium_confidence: 0.50
      direction_tolerance_deg: 10.0
      corridor_half_fov_deg: 60.0
      corridor_step_deg: 5.0
      min_corridor_width_deg: 15.0
      corridor_max_clearance_m: 4.0
      max_recovery_attempts: 2
  progress:
    history_length: 6
    stall_distance_m: 0.08
    spin_yaw_deg: 85.0
    landmark_clearance_m: 2.0
    final_success_clearance_m: 3.0
    landmark_arrival_confirmations: 2
  recovery:
    stuck_window_sec: 2.0
    stuck_displacement_threshold_m: 0.05
    stuck_yaw_threshold_deg: 5.0
    pause_sec: 0.5
    reverse_sec: 0.65
    turn_sec: 0.35

debug:
  image:
    enabled: true
    path: "debug/local/vln_debug.png"
    update_period_sec: 1.0
    depth_enabled: false
    depth_path: "debug/local/depth_debug.png"
  video:
    enabled: true
    path: "debug/local/videos/vln_debug.mp4"
    fps: 4.0
  observer_video:
    enabled: true
    path: "debug/local/observevideos/observer.mp4"
    fps: 8.0

logging:
  level: "INFO"
  motion_log_period_sec: 2.5
