# AGX 点目标导航配置。

# Isaac Sim 仿真设备。
simulation:
  # 渲染使用的 GPU 编号；null 表示由 Isaac Sim 选择。
  active_gpu: null
  # 物理计算使用的 GPU 编号。
  physics_gpu: 0
  # 是否启用多 GPU 渲染。
  multi_gpu: false

# 场景加载公共参数；场景文件和初始位姿由 episodes.json 提供。
scene:
  # 场景加载到仿真 Stage 的路径。
  prim_path: "/World/Environment"
  # 场景没有地面时可开启默认地面。
  add_default_ground_plane: false
  # 等待场景资源加载的最长时间，单位为秒。
  stage_load_timeout_sec: 120.0
  # 是否调用公共室内灯光接口，在当前仿真场景中添加顶灯。
  add_indoor_lighting: true
# NavDP 推理服务连接与轨迹结果校验参数。
server:
  # NavDP HTTP 服务地址。
  base_url: "http://127.0.0.1:8889"
  # 单次请求超时时间，单位为秒。
  timeout_sec: 30.0
  # NavDP 返回值低于该阈值时视为停止候选。
  stop_threshold: -0.5
  # 上传 RGB 图像的 JPEG 质量。
  jpeg_quality: 92
  # 允许轨迹坐标出现的最大绝对值，单位为米。
  max_abs_coordinate_m: 12.0
  # 相邻轨迹点允许的最大距离，单位为米。
  max_point_jump_m: 2.0
  # 有效轨迹的最小长度，单位为米。
  min_path_length_m: 0.08
  # 客户端与服务端模型信息的匹配容差，单位为米。
  model_match_tolerance_m: 0.02

# 远程 InternVLA-N1 System 2 高层语义规划。
internnav_s2:
  # 是否启用 S2 高层规划。
  enabled: true
  server:
    # 远程 S2 服务地址。
    base_url: "http://10.4.113.176:5801"
    # 无历史单帧测试接口。
    infer_once_endpoint: "/infer_once"
    # 导航会话重置接口。
    reset_endpoint: "/reset"
    # 有历史连续导航接口。
    infer_endpoint: "/infer"
    # 单次 S2 请求超时时间，单位为秒。
    timeout_sec: 180.0
    # 上传图像 JPEG 质量。
    jpeg_quality: 92
    # S2 输出像素所在的模型图像宽度。
    model_image_width: 384
    # S2 输出像素所在的模型图像高度。
    model_image_height: 384
  goal_adapter:
    # pixel-goal 深度中值使用的像素邻域半径。
    depth_patch_radius_px: 3
    # 有效深度下限，单位为米。
    min_depth_m: 0.12
    # 有效深度上限，单位为米。
    max_depth_m: 5.0
    # metric goal 最小距离，单位为米。
    min_goal_distance_m: 0.25
    # metric goal 最大距离，单位为米。
    max_goal_distance_m: 5.0
    # pixel-goal 邻域内有效深度像素的最小比例。
    minimum_valid_depth_fraction: 0.60
    # pixel-goal 邻域允许的最大 10% 至 90% 深度跨度，单位为米。
    maximum_depth_spread_m: 0.50
  # FORWARD 动作对应的局部目标距离，单位为米。
  forward_action_distance_m: 0.25
  # S2 局部目标到达距离，单位为米。
  goal_reached_tolerance_m: 0.10
  # LEFT/RIGHT 动作对应的航向变化，单位为度。
  turn_action_deg: 15.0
  # 连续转向达到该角度后重新获取前视画面并请求 S2。
  turn_redecision_deg: 30.0
  # 离散转向完成容差，单位为度。
  turn_tolerance_deg: 2.0
  # 离散转向比例控制增益。
  turn_gain: 2.0
  # 离散转向最大角速度，单位为弧度每秒。
  turn_max_angular_radps: 0.50
  # 连续 STOP 达到该次数后结束任务。
  stop_confirmations: 2
  # 固定下视相机请求前等待的渲染帧数。
  lookdown_settle_frames: 1

# 发送给 NavDP 的前视相机参数。
camera:
  # 前视相机水平视角，导航与数据采集共用。
  horizontal_fov_deg: 80.0
  # RGB-D 图像宽度，单位为像素。
  width: 640
  # RGB-D 图像高度，单位为像素。
  height: 480
  # 相机更新频率，单位为赫兹。
  frequency_hz: 15
  # 导航开始前用于稳定传感器的渲染帧数。
  warmup_render_frames: 30

# 手动选择导航目标的距离范围。
goal:
  # 允许选择的最小目标距离，单位为米。
  min_distance_m: 0.25
  # 允许选择的最大目标距离，单位为米。
  max_distance_m: 10.0

# 粗粒度与细粒度规划任务的调度参数。
execution:
  # 底层规划器：COARSE、FINE、MPPI 或 KMPPI。
  default_mode: "COARSE"
  # NavDP 滚动推理周期，单位为秒。
  coarse_planning_period_sec: 0.50
  # 同一局部目标允许连续出现短轨迹的最大次数。
  max_short_trajectory_retries: 3
  # Hybrid A* 滚动规划周期，单位为秒。
  fine_planning_period_sec: 0.20
  # 沿已知空闲地图路径选择细粒度局部目标的前视距离，单位为米。
  fine_local_goal_lookahead_m: 1.20
  # 规划结果允许的最大时间延迟，单位为秒。
  max_result_age_sec: 1.00
  # 新轨迹起点与机器人当前位置允许的最大连接误差，单位为米。
  max_path_join_error_m: 0.35
  # 接受新轨迹所需的最小剩余长度，单位为米。
  min_remaining_path_m: 0.05
  # 判定机器人到达最终目标的距离，单位为米。
  goal_reached_tolerance_m: 0.30

# 粗粒度 NavDP 轨迹跟踪速度参数。
coarse_tracking:
  # 粗粒度模式最大前进速度，单位为米每秒。
  max_linear_mps: 1.00
  # 粗粒度模式最大旋转速度，单位为弧度每秒。
  max_angular_radps: 0.50

# 细粒度轨迹跟踪速度与误差参数。
sampling_planner:
  # MPPI/KMPPI 共用的模型、代价和采样参数。
  config_path: "constraint_traverse/configs/benchmark.yaml"

fine_tracking:
  # 细粒度模式最大前进或后退速度，单位为米每秒。
  max_linear_mps: 0.60
  # 细粒度模式最大旋转速度，单位为弧度每秒。
  max_angular_radps: 0.35
  # 轨迹跟踪前视距离，单位为米。
  lookahead_m: 0.20
  # 局部轨迹到达距离，单位为米。
  arrival_distance_m: 0.05
  # 允许的最大横向轨迹误差，单位为米。
  max_path_error_m: 0.20
  # 停车距离计算使用的保守减速度，单位为米每二次方秒。
  safety_braking_deceleration_mps2: 0.30
  # 从新障碍出现到停车指令生效的估计时间，单位为秒。
  safety_reaction_time_sec: 0.30

# 键盘方向键的手动控制速度。
manual_control:
  # 手动前进或后退速度，单位为米每秒。
  linear_mps: 1.00
  # 手动左转或右转速度，单位为弧度每秒。
  angular_radps: 0.50

# Hybrid A* 搜索、AGX 车体轮廓和路径代价参数。
fine_planner:
  # 用于碰撞检查的 AGX 平面组合轮廓。
  footprint:
    # 车体轮廓由多个矩形部件的并集组成。
    parts:
      # 中央车体矩形，坐标使用机器人坐标系，正 X 向前，正 Y 向左。
      - name: "chassis"
        # 中央车体后边界，单位为米。
        min_x_m: -0.33
        # 中央车体前边界，单位为米。
        max_x_m: 0.33
        # 中央车体右边界，单位为米。
        min_y_m: -0.25
        # 中央车体左边界，单位为米。
        max_y_m: 0.25
      # 前轮区域矩形。
      - name: "front_wheels"
        # 前轮区域后边界，单位为米。
        min_x_m: 0.24
        # 前轮区域前边界，单位为米。
        max_x_m: 0.40
        # 前轮区域右边界，单位为米。
        min_y_m: -0.32
        # 前轮区域左边界，单位为米。
        max_y_m: 0.32
      # 后轮区域矩形。
      - name: "rear_wheels"
        # 后轮区域后边界，单位为米。
        min_x_m: -0.40
        # 后轮区域前边界，单位为米。
        max_x_m: -0.24
        # 后轮区域右边界，单位为米。
        min_y_m: -0.32
        # 后轮区域左边界，单位为米。
        max_y_m: 0.32
    # 车体轮廓外增加的安全余量，单位为米。
    margin_m: 0.03
  # 计入二维障碍物的最低相对高度，单位为米。
  obstacle_min_height_m: 0.05
  # 计入二维障碍物的最高相对高度，单位为米。
  obstacle_max_height_m: 1.50
  # Hybrid A* 航向离散分辨率，单位为度。
  yaw_resolution_deg: 5.0
  # 单个平移运动段长度，单位为米。
  step_length_m: 0.10
  # 完整局部目标暂时不可达时，允许返回的增量路径最大行程，单位为米。
  partial_path_max_distance_m: 0.30
  # 已找到安全增量路径后，继续搜索完整目标的最大节点数量。
  partial_search_max_expansions: 60
  # 每个运动段进行碰撞检查的采样间隔，单位为米。
  collision_sample_step_m: 0.05
  # 前进与后退运动段使用的曲率样本，单位为每米。
  curvature_samples_per_m: [-1.2, -0.6, 0.0, 0.6, 1.2]
  # 局部目标位置容差，单位为米。
  goal_tolerance_m: 0.05
  # 单次细粒度规划允许的最大距离，单位为米。
  max_plan_distance_m: 4.0
  # 单次搜索允许扩展的最大节点数量。
  max_expansions: 10000
  # 低余量路径的代价权重。
  clearance_weight: 0.01
  # 大曲率运动段的代价权重。
  curvature_weight: 0.01
  # 相邻运动段曲率变化的代价权重。
  curvature_change_weight: 0.01
  # 后退运动相对于前进运动的代价倍率。
  reverse_penalty: 1.25
  # 前进与后退方向切换的代价倍率。
  direction_change_penalty: 1.50
  # 原地旋转运动段的单步角度，单位为度。
  spin_step_deg: 10.0
  # 原地旋转运动的代价倍率。
  spin_penalty: 1.20
  # 启发函数在搜索优先级中的权重。
  heuristic_weight: 8.0

# 面向局部瓶颈和持续受限通道的状态转移图参数。
restricted_space:
  route_corridor:
    # 从机器人当前位置向目标方向分析的最大通路长度，单位为米。
    horizon_m: 4.0
    # 相邻横截面的距离，单位为米。
    cross_section_step_m: 0.10
    # 参考通路两侧参与分析的宽度，单位为米。
    half_width_m: 1.00
    # 搜索高余量参考线时的横向采样间隔，单位为米。
    center_search_step_m: 0.05
    # 参考线偏离 NavDP 通路的代价权重。
    center_deviation_weight: 0.20
    # 参考线平滑迭代次数。
    smoothing_iterations: 2
  traversability_graph:
    # 粗分辨率横向状态采样间隔，单位为米。
    lateral_step_m: 0.10
    # 相对通路方向允许采样的最大航向差，单位为度。
    heading_limit_deg: 60.0
    # 粗分辨率航向采样间隔，单位为度。
    heading_step_deg: 20.0
    # 计算局部容量时使用的前后窗口半径，单位为米。
    local_window_half_m: 0.60
    # motion primitive 末端与离散状态允许的位置误差，单位为米。
    endpoint_position_tolerance_m: 0.09
    # motion primitive 末端与离散状态允许的航向误差，单位为度。
    endpoint_heading_tolerance_deg: 12.0
    # 容量接近阈值时使用的横向细化间隔，单位为米。
    refined_lateral_step_m: 0.05
    # 容量接近阈值时使用的航向细化间隔，单位为度。
    refined_heading_step_deg: 10.0
    # 截面状态达到该观测比例后才允许判定受限结构。
    observation_threshold: 0.75
    # 截面连接达到该观测比例后才允许判定受限结构。
    edge_observation_threshold: 0.70
    # 相对局部基线低于该比例时判为容量收缩。
    local_contraction_threshold: 0.55
    # 计算局部容量基线的通路半径，单位为米。
    local_baseline_radius_m: 0.80
    # 状态容量持续低于该值时判为持续受限。
    state_capacity_threshold: 0.40
    # 连接容量持续低于该值时判为持续受限。
    transition_capacity_threshold: 0.50
    # 持续受限区间的最小长度，单位为米。
    constrained_min_length_m: 0.80
    # 机器人前方参与自动切换判断的距离，单位为米。
    trigger_lookahead_m: 2.50
    # 鲁棒穿越状态需要保留的最小几何余量，单位为米。
    robust_node_clearance_m: 0.05
    # 鲁棒运动连接需要保留的最小几何余量，单位为米。
    robust_edge_clearance_m: 0.05
    # 受限区域入口前保留的姿态调整距离，单位为米。
    pre_distance_m: 0.80
    # 受限区域出口后要求恢复的空间长度，单位为米。
    post_distance_m: 0.80
    # 容量与阈值相差不超过该值时触发分辨率细化。
    refinement_threshold_band: 0.10

# Hybrid A* 路径的连续平滑与复核参数。
trajectory_refiner:
  # 最大平滑迭代次数。
  iterations: 8
  # 每次迭代向相邻点中值移动的比例。
  smoothing_gain: 0.25
  # 平滑结果需要保留的最小障碍余量，单位为米。
  minimum_clearance_m: 0.04
  # 平滑结果允许的最大曲率，单位为每米。
  maximum_curvature_per_m: 1.20

# 目标选择地图与局部体素地图来源。
map_selector:
  # 导航局部地图融合的相机名称。
  sources: ["front", "down"]
  # 目标选择地图的图像边长，单位为像素。
  image_size_px: 420
  # 目标选择地图显示的物理范围，单位为米。
  view_size_m: 10.0
  # 目标选择地图显示的机器人后方范围，单位为米。
  rear_view_m: 1.5
  # 目标选择地图刷新周期，单位为秒。
  render_period_sec: 0.25
  # 地图显示障碍物的最低相对高度，单位为米。
  obstacle_min_relative_z_m: 0.05
  # 地图显示障碍物的最高相对高度，单位为米。
  obstacle_max_relative_z_m: 1.50

# RGB-D 局部三维地图的传感器与融合参数。
mapping:
  camera:
    # 地图相机图像宽度，单位为像素。
    width: 640
    # 地图相机图像高度，单位为像素。
    height: 480
    # 地图相机更新频率，单位为赫兹。
    frequency_hz: 15
  map:
    # 局部地图的前后物理尺寸，单位为米。
    size_x_m: 10.0
    # 局部地图的左右物理尺寸，单位为米。
    size_y_m: 10.0
    # 相对机器人基座的最低高度，单位为米。
    min_z_m: -0.20
    # 相对机器人基座的最高高度，单位为米。
    max_z_m: 2.80
    # 体素边长，单位为米。
    resolution_m: 0.05
    # 局部地图平移阈值，单位为米。
    slide_threshold_m: 0.20
    # 最小有效深度，单位为米。
    min_depth_m: 0.12
    # 最大有效深度，单位为米。
    max_depth_m: 5.0
    # 单条射线的最大长度，单位为米。
    max_ray_length_m: 5.0
    # 深度图采样像素间隔。
    pixel_stride: 10
    # 射线终点为障碍时的更新概率。
    probability_hit: 0.85
    # 射线穿过空闲空间时的更新概率。
    probability_miss: 0.30
    # 体素占用概率下限。
    probability_min: 0.12
    # 体素占用概率上限。
    probability_max: 0.98
    # 判为障碍的占用概率阈值。
    probability_occupied: 0.80
    # 判为空闲的占用概率阈值。
    probability_free: 0.45
    # 地图融合周期，单位为秒。
    integration_period_sec: 0.25
  # 两路 RGB-D 帧允许的最大时间差，单位为秒。
  max_frame_skew_sec: 0.08

# 调试图片保存参数。
debug:
  # NavDP 候选轨迹图片的覆盖保存路径。
  candidate_image_path: "debug/local/navdp_candidates.png"
  # 细粒度三维几何图片的覆盖保存路径。
  fine_image_path: "debug/local/fine_geometry.png"
  # 细粒度三维几何图片刷新周期，单位为秒。
  fine_update_period_sec: 0.50
  # NavDP 候选轨迹图片显示的物理范围，单位为米。
  view_size_m: 10.0
