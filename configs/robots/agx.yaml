asset:
  usd_path: "src/ros2_car_model_ws/src/1557/urdf/1557_all/1557_all.usd"
  prim_path: "/World/Robot"
  articulation_path: "dummy_base_link"

spawn:
  z_m: 0.32

simulation:
  physics_dt: 0.0166667
  rendering_dt: 0.0166667

sensors:
  #front_prim_path: "/World/Robot/pan_tilt_pitch_link/pan_tilt_surface/camera_mount/camera_body/camera_base/PanCamera"
  front_prim_path: "link6/Camera"
  s2_down_prim_path: "link6/DownCamera"
  mapping_down_prim_path: "dummy_base_link/DownCamera"
  observer_prim_path: "dummy_base_link/observeCamera"
controller:
  left_wheel_joint_names: ["fl_wheel", "rl_wheel"]
  right_wheel_joint_names: ["fr_wheel", "rr_wheel"]
  steering_joint_names: ["fl_steering_joint", "fr_steering_joint", "rl_steering_joint", "rr_steering_joint"]
  wheel_drive_velocity: 14.0
  turn_drive_velocity: 6.0
  steering_angle: 0.65
  turn_mode: "spin_4ws"
  turn_steering_angle: 0.50
  rear_steering_ratio: 1.0
  wheel_drive_damping: 10000.0
  steering_stiffness: 10000.0
  steering_damping: 1000.0
  hold_joint_stiffness: 20000.0
  hold_joint_damping: 2000.0
  continuous:
    # 车体坐标系中正 X 向前，正 Y 向左；转向轴为负 Z，驱动轴为正 Y。
    wheels:
      - {drive_joint: fl_wheel, steering_joint: fl_steering_joint, x_m: 0.25, y_m: 0.19, radius_m: 0.09, steering_sign: -1, drive_sign: 1}
      - {drive_joint: fr_wheel, steering_joint: fr_steering_joint, x_m: 0.25, y_m: -0.19, radius_m: 0.09, steering_sign: -1, drive_sign: 1}
      - {drive_joint: rl_wheel, steering_joint: rl_steering_joint, x_m: -0.25, y_m: 0.19, radius_m: 0.09, steering_sign: -1, drive_sign: 1}
      - {drive_joint: rr_wheel, steering_joint: rr_steering_joint, x_m: -0.23, y_m: -0.206, radius_m: 0.09, steering_sign: -1, drive_sign: 1}
    max_linear_mps: 1.0
    max_angular_radps: 0.5
    max_acceleration_mps2: 0.60
    max_lateral_acceleration_mps2: 0.35
    max_wheel_radps: 14.0
    max_steering_rad: 1.4
    steering_alignment_rad: 0.12
    lookahead_m: 0.45
    arrival_distance_m: 0.06
    max_path_error_m: 0.8
    timeout_sec: 60.0
