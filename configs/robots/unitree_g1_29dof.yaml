schema_version: "2.0"

identity:
  name: "unitree_g1_29dof"
  type: "unitree_g1_policy"

asset:
  usd_path: "src/unitree_model/g1_29dof/usd/g1_29dof_rev_1_0.usd"
  prim_path: "/World/Robot/g1_29dof_rev_1_0"
  articulation_path: "pelvis"

spawn:
  z_m: 0.8

simulation:
  physics_dt: 0.005
  rendering_dt: 0.02
  policy_decimation: 4

sensors:
  camera:
    front_prim_path: "torso_link/d435_link/Camera"
    observer_enabled: true
    observer_prim_path: "pelvis/observeCamera"
    width: 1280
    height: 960
    frequency_hz: 10
    horizontal_fov_deg: 90.0
    follow_front_in_gui: false
    follow_observer_in_gui: true
    depth_roi_vertical_range: [0.45, 0.85]
    valid_depth_range_m: [0.20, 10.0]
    obstacle_roi_vertical_range: [0.50, 0.95]
    obstacle_center_width_ratio: 0.34
    obstacle_side_width_ratio: 0.30
    depth_eval_period_sec: 0.12
  lidar:
    prim_path: "pelvis/Lidar"
    horizontal_fov_deg: 180.0
    vertical_fov_deg: 10.0
    horizontal_resolution_deg: 0.4
    vertical_resolution_deg: 4.0
    rotation_rate_hz: 30.0
    min_range_m: 0.40
    max_range_m: 10.0
    yaw_offset_deg: 0.0
    sector_merge_keep_sec: 1.5

controller:
  policy_path: "src/unitree_model/g1_29dof/policy/policy.pt"
  deploy_config_path: "src/unitree_model/g1_29dof/policy/deploy.yaml"
  inference_device: "cpu"
  standup_duration_sec: 2.0
  odom_filter_alpha: 0.20
  sdk_joint_names:
    - "left_hip_pitch_joint"
    - "left_hip_roll_joint"
    - "left_hip_yaw_joint"
    - "left_knee_joint"
    - "left_ankle_pitch_joint"
    - "left_ankle_roll_joint"
    - "right_hip_pitch_joint"
    - "right_hip_roll_joint"
    - "right_hip_yaw_joint"
    - "right_knee_joint"
    - "right_ankle_pitch_joint"
    - "right_ankle_roll_joint"
    - "waist_yaw_joint"
    - "waist_roll_joint"
    - "waist_pitch_joint"
    - "left_shoulder_pitch_joint"
    - "left_shoulder_roll_joint"
    - "left_shoulder_yaw_joint"
    - "left_elbow_joint"
    - "left_wrist_roll_joint"
    - "left_wrist_pitch_joint"
    - "left_wrist_yaw_joint"
    - "right_shoulder_pitch_joint"
    - "right_shoulder_roll_joint"
    - "right_shoulder_yaw_joint"
    - "right_elbow_joint"
    - "right_wrist_roll_joint"
    - "right_wrist_pitch_joint"
    - "right_wrist_yaw_joint"

primitives:
  forward_distance_m: 0.55
  turn_angle_deg: 15.0
  distance_tolerance_m: 0.04
  turn_tolerance_deg: 1.5
  forward_timeout_sec: 4.0
  turn_timeout_sec: 6.0
  forward_command: 1.0
  turn_command: 1.0
  settle_max_wait_sec: 0.60
  settle_linear_speed_threshold_mps: 0.08
  settle_angular_speed_threshold_radps: 0.08
  settle_stable_duration_sec: 0.15

motion_model:
  type: "biped_in_place"
  turn_drift_margin_m: 0.08
  sweep_resolution_deg: 2.5

geometry:
  # Conservative approximate body envelope: 0.56 m long x 0.48 m wide.
  footprint_polygon_xy_m:
    - [0.28, 0.24]
    - [-0.28, 0.24]
    - [-0.28, -0.24]
    - [0.28, -0.24]
  safety_margin_m: 0.05
  obstacle_stop_distance_m: 0.30

safety:
  fall_detection_enabled: true
  max_roll_pitch_deg: 35.0
  min_base_height_m: 0.45
  confirmation_sec: 0.30
