simulation:
  active_gpu: null
  physics_gpu: 0
  multi_gpu: false

scene:
  prim_path: "/World/Environment"
  add_default_ground_plane: false
  stage_load_timeout_sec: 120.0
  add_indoor_lighting: true

# Automatic initial placement. The collector searches for an upward-facing,
# collision-free floor patch inside the loaded scene. Explicit --spawn-x and
# --spawn-y override the automatic XY search; --spawn-yaw may be used alone.
spawn:
  sample_step_m: 0.60
  max_attempts: 600
  random_seed: 17
  bounds_margin_m: 0.60
  holding_height_m: 5.0
  # 自动地面查询前用于建立 PhysX 碰撞场景的仿真帧数。
  query_warmup_frames: 8
  settle_frames: 12

  # Floor height is estimated from repeated downward PhysX raycasts.
  floor_estimation_samples: 96
  floor_probe_height_m: 2.20
  floor_probe_depth_m: 1.50
  floor_height_bin_m: 0.10
  floor_height_tolerance_m: 0.18
  max_slope_deg: 10.0

  # AGX footprint used only for initial-spawn overlap checking.
  robot_half_length_m: 0.43
  robot_half_width_m: 0.35
  clearance_m: 0.20
  collision_check_height_m: 0.65
  collision_bottom_offset_m: 0.06

cameras:
  front_prim_path: "pan_tilt_pitch_link/pan_tilt_surface/camera_mount/camera_body/camera_base/PanCamera"
  down_prim_path: "dummy_base_link/DownCamera"
  width: 640
  height: 480
  frequency_hz: 15
  warmup_render_frames: 30
  max_frame_skew_sec: 0.03

# Same causal rolling voxel representation used by the current navigation stack.
# The map is reset for every START DEMO.
voxel_map:
  size_x_m: 10.0
  size_y_m: 10.0
  min_z_m: -0.20
  max_z_m: 2.80
  resolution_m: 0.05
  slide_threshold_m: 0.20
  min_depth_m: 0.12
  max_depth_m: 5.0
  max_ray_length_m: 5.0
  pixel_stride: 10
  probability_hit: 0.85
  probability_miss: 0.30
  probability_min: 0.12
  probability_max: 0.98
  probability_occupied: 0.80
  probability_free: 0.45

# Robot-centric policy input candidate saved with every sample.
bev:
  forward_m: 3.0
  backward_m: 1.0
  left_m: 2.0
  right_m: 2.0
  resolution_m: 0.05
  obstacle_min_height_m: 0.05
  obstacle_max_height_m: 1.50

teleop:
  max_linear_mps: 0.50
  max_angular_radps: 0.50
  linear_accel_mps2: 0.60
  angular_accel_radps2: 1.00
  linear_decel_mps2: 0.90
  angular_decel_radps2: 1.40

collection:
  jpeg_quality: 92
  png_compression: 1
  max_episode_duration_sec: 120.0
  min_success_samples: 5
  # START 后用于初始化 episode 地图且不写入训练数据的 RGB-D 对数。
  episode_map_warmup_pairs: 2
  start_max_linear_mps: 0.05
  start_max_angular_radps: 0.08
  # 单帧深度图中有效像素所需的最低比例。
  min_depth_valid_ratio: 0.02
  # 第一帧与 START 位姿、最后一帧与结束位姿允许的位置误差，单位为米。
  endpoint_position_tolerance_m: 0.15
  # 第一帧与 START 位姿、最后一帧与结束位姿允许的航向误差，单位为度。
  endpoint_yaw_tolerance_deg: 10.0
  # 成功数据最后一帧相对目标允许的位置误差，单位为米。
  success_goal_position_tolerance_m: 0.15
  # 成功数据最后一帧相对目标允许的航向误差，单位为度。
  success_goal_yaw_tolerance_deg: 10.0

ui:
  bev_image_size_px: 480
  update_period_sec: 0.10
