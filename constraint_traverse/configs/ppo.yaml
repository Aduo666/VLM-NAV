# 每次更新采样的控制周期数量；一个控制周期包含四个物理步。
ppo:
  num_envs: 1
  rollout_steps: 32
  scene_iterations: 64
  num_learning_epochs: 4
  num_mini_batches: 1
  learning_rate: 0.00003
  initial_noise_std: 0.1
  clip_param: 0.1
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.001
  value_loss_coef: 1.0
  max_grad_norm: 1.0
  save_interval: 50
  timeout_sec: 60.0
  collision_force_threshold_n: 1.0

# 速度惩罚按仿真时间计算。停车进度中断后会扣回此前获得的进度奖励。
reward:
  progress_weight: 5.0
  success_reward: 10.0
  collision_penalty: 10.0
  timeout_penalty: 2.0
  time_penalty_per_sec: 0.05
  action_change_penalty: 0.01
  linear_speed_penalty_per_sec: 5.0
  angular_speed_penalty_per_sec: 5.0
  hold_progress_reward: 2.0
