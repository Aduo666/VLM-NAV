<svg width="1440" height="560" viewBox="0 0 1440 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VLM-NAV Isaac Sim visual language navigation hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.52" stop-color="#132238"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 120) rotate(135) scale(520 320)">
      <stop stop-color="#38BDF8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(370 390) rotate(-10) scale(440 260)">
      <stop stop-color="#F59E0B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="route" x1="570" y1="426" x2="1120" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="560" fill="url(#bg)"/>
  <rect width="1440" height="560" fill="url(#grid)"/>
  <rect width="1440" height="560" fill="url(#glowA)"/>
  <rect width="1440" height="560" fill="url(#glowB)"/>

  <g filter="url(#shadow)">
    <rect x="74" y="76" width="506" height="374" rx="28" fill="url(#card)" stroke="#334155"/>
    <text x="116" y="144" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="54" font-weight="800">VLM-NAV</text>
    <text x="118" y="188" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="21" font-weight="500">Isaac Sim VLN for custom Ackermann robots</text>
    <rect x="116" y="228" width="380" height="58" rx="16" fill="#020617" stroke="#1E293B"/>
    <text x="138" y="263" fill="#F8FAFC" font-family="JetBrains Mono, ui-monospace, SFMono-Regular" font-size="20">"go forward, find landmark..."</text>
    <g transform="translate(116 322)">
      <rect width="112" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
      <text x="23" y="25" fill="#7DD3FC" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">RGB-D</text>
      <rect x="126" width="112" height="38" rx="19" fill="#22C55E" fill-opacity="0.13" stroke="#22C55E"/>
      <text x="153" y="25" fill="#86EFAC" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">LiDAR</text>
      <rect x="252" width="148" height="38" rx="19" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B"/>
      <text x="277" y="25" fill="#FCD34D" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">VLM Policy</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="62" width="684" height="412" rx="34" fill="#0B1120" stroke="#334155"/>
    <rect x="692" y="104" width="248" height="320" rx="20" fill="#111827" stroke="#273449"/>
    <text x="716" y="142" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">First-person view</text>
    <rect x="716" y="164" width="200" height="128" rx="16" fill="#1F2937"/>
    <path d="M716 253 C760 224 815 224 916 253 L916 292 L716 292 Z" fill="#334155"/>
    <rect x="778" y="191" width="72" height="58" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="790" cy="255" r="13" fill="#38BDF8"/>
    <circle cx="838" cy="255" r="13" fill="#38BDF8"/>
    <circle cx="854" cy="180" r="8" fill="#F59E0B"/>
    <path d="M816 292 L820 369" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>
    <circle cx="820" cy="376" r="12" fill="#F59E0B"/>
    <text x="731" y="344" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="14">semantic bbox + subgoal</text>

    <rect x="984" y="104" width="306" height="320" rx="20" fill="#0F172A" stroke="#273449"/>
    <text x="1008" y="142" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">North-up map</text>
    <rect x="1012" y="166" width="250" height="214" rx="16" fill="#E5E7EB"/>
    <path d="M1028 216 L1132 216 L1132 250 L1188 250 L1188 286 L1244 286" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/>
    <path d="M1036 346 L1120 300 L1214 300" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 7"/>
    <path d="M1046 343 C1115 306 1138 266 1218 248" stroke="url(#route)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1046" cy="343" r="12" fill="#2563EB" stroke="#EFF6FF" stroke-width="4"/>
    <circle cx="1162" cy="270" r="13" fill="#DB2777" stroke="#FCE7F3" stroke-width="4"/>
    <circle cx="1218" cy="248" r="13" fill="#22C55E" stroke="#DCFCE7" stroke-width="4"/>
    <text x="1014" y="408" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="14">occupancy, trajectory, landmarks</text>
  </g>

  <path d="M585 278 C622 258 625 234 650 224" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="9 9"/>
  <path d="M585 336 C642 374 683 386 740 386" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="9 9"/>
</svg>
