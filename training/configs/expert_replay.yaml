data:
  interiornav_root: "/Data/qiang/interiornav_data"
  output_root: "/Data/qiang/data/CAPTAINav/expert_replay"

capture:
  render_warmup_frames: 8
  render_frames_per_pose: 2
  pose_position_tolerance_m: 0.02
  pose_orientation_tolerance_deg: 2.0
  rgb_history_frames: 8
  motion_history_frames: 32
  local_map_size_m: 12.0
  local_map_cells: 128
  global_map_cells: 320

lighting:
  enabled: true
  intensity: 3000.0
  exposure: 2.0
  shadows_enabled: false

replay:
  path_spacing_m: 0.15
  max_turn_step_deg: 15.0
  linear_speed_mps: 0.75
  angular_speed_radps: 0.75
  final_hold_sec: 0.25

occupancy:
  resolution_m: 0.08
  size_m: 80.0
  update_period_sec: 0.02
  min_range_m: 0.20
  max_range_m: 10.0
  occupied_log_odds: 0.90
  free_log_odds: -0.25
  log_odds_min: -4.0
  log_odds_max: 4.0
  occupied_threshold: 1.20
  free_threshold: -0.45
  occupied_min_neighbors: 3
  decay_rate: 1.0
  inflation_radius_m: 0.26
  unknown_is_traversable: false
  unknown_cell_cost: 0.80
  debug_image_path: "/Data/qiang/data/CAPTAINav/expert_replay/map_unused.png"

rgbd:
  min_depth_m: 0.30
  max_depth_m: 10.0
  pixel_stride: 8
  vertical_min_ratio: 0.12
  vertical_max_ratio: 0.95
  obstacle_min_height_m: 0.10
  obstacle_max_height_m: 1.80
  floor_tolerance_below_m: 0.20

frontier:
  min_cluster_cells: 6
  max_frontiers: 24
  information_radius_m: 1.0
  max_distance_m: 12.0
  persistent_match_radius_m: 0.75
  approach_offset_m: 0.40
  approach_search_radius_m: 0.80

frontier_oracle:
  route_sample_spacing_m: 0.04
  max_crossing_distance_m: 0.80
  max_route_distance_m: 1.00
  path_cost_weight: 0.03
  softmax_temperature_m: 0.50
  min_selection_probability: 0.45
  min_cost_margin_m: 0.10

scheduler:
  min_period_sec: 0.50
  max_period_sec: 2.00
  translation_trigger_m: 0.35
  yaw_trigger_deg: 12.0
  tracker_refresh_sec: 1.25

perception:
  min_detector_confidence: 0.30
  auto_accept_confidence: 0.75
  min_depth_valid_ratio: 0.12
  min_depth_m: 0.20
  max_depth_m: 10.0
  center_patch_ratio: 0.40
  track_match_radius_m: 0.80
  track_memory_sec: 5.0
